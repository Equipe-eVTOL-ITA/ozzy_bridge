; =============================================================================
; ozzy_bridge — firmware do ESP32
; =============================================================================
;
;   pio run -e humble -t upload        # grava a versão Humble (Jetson/desktop)
;   pio run -e jazzy  -t upload        # grava a versão Jazzy  (Raspberry Pi)
;   pio device monitor                 # console de depuração, 115200
;
; POR QUE DOIS AMBIENTES
; ---------------------
; O time voa com Humble e Jazzy AO MESMO TEMPO. O cliente micro-ROS é compilado
; contra as definições de tipo de UMA distro, e o lado do computador espera as
; da distro dele. Cliente e workspace de distros diferentes conectam no agente,
; aparecem no `ros2 node list` e NÃO trocam mensagem nenhuma — sem erro, sem
; aviso. É exatamente a classe de falha silenciosa que o `evtol.repos` e os
; perfis do `env/` existem para impedir, e a defesa aqui é a mesma: a distro é
; declarada, não presumida.
;
; Grave o ambiente que casa com o `.evtol-profile` da máquina que vai rodar a
; máquina de estados.
; =============================================================================

[env]
platform  = espressif32@6.9.0
board     = nodemcu-32s
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; --- micro-ROS ---------------------------------------------------------------
; Pinado num COMMIT, não numa tag. As únicas tags do micro_ros_platformio são
; 1.0.0 (2022) e 2.0.0 (2023) — as duas anteriores ao Jazzy, e portanto sem o
; `board_microros_distro = jazzy` de que o ambiente abaixo depende. Pinar na
; tag mais nova daria um erro de "distro desconhecida" com cara de erro de
; digitação.
;
; Este commit é o main de 2025-09-17. Para atualizar: troque o hash, compile os
; DOIS ambientes, e só então faça o commit.
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1

board_microros_transport = wifi

; --- MAVLink -----------------------------------------------------------------
; O c_library_v2 é header-only e GERADO — não tem tags, e o master anda todo
; dia. O script abaixo clona um commit fixo em `vendor/mavlink` (ignorado pelo
; git) e acrescenta o include path. Assim ninguém precisa rodar nada à mão, o
; repositório não carrega 40 MB de header gerado, e a versão continua pinada.
;
; Submódulo de git seria a alternativa óbvia, e o `ARCHITECTURE.md` do
; workspace a proíbe explicitamente (regra de ouro 2).
extra_scripts = pre:scripts/fetch_mavlink.py

build_flags =
    ; Os headers do MAVLink são structs packed, e todo acesso a campo gera este
    ; aviso no GCC. São centenas — deixá-los ligados esconde os avisos reais.
    -Wno-address-of-packed-member

[env:humble]
board_microros_distro = humble

[env:jazzy]
board_microros_distro = jazzy
